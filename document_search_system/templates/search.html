<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索文档 - 文档本地存储检索系统1.2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-top: 50px;
      border-radius: 5px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .nav {
      text-align: center;
      margin-bottom: 30px;
    }
    .nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #0066cc;
      font-weight: bold;
    }
    .search-form {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>文档本地存储检索系统1.2</h1>
    <div class="nav">
      <a href="/">首页</a> | 
      <a href="/upload">上传文档</a> | 
      <a href="/search">搜索文档</a> | 
      <a href="/file-list">文件列表</a> | 
      <a href="/categories">分类管理</a> | 
      {% if user_role == 'admin' %}
      <a href="/settings">系统设置</a>
      {% endif %}
    </div>
    <h2>搜索文档</h2>
    <form class="search-form" action="/search-results" method="get">
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">关键词搜索 (MATCH)</label>
        <input type="text" name="match" placeholder="输入关键词进行搜索..." value="{{ match or '' }}">
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">全文搜索 (LIKE)</label>
        <input type="text" name="like" placeholder="输入句子或短语进行全文搜索..." value="{{ like or '' }}">
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">分类</label>
        <select name="category">
          <option value="" {% if not category %}selected{% endif %}>全部分类</option>
          {% for category in categories %}
            <option value="{{ category[0] }}" {% if category_id == category[0]|string %}selected{% endif %}>{{ category[1] }}</option>
          {% endfor %}
        </select>
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">文件类型</label>
        <select name="file_type">
          <option value="" {% if not file_type %}selected{% endif %}>全部类型</option>
          <option value=".pdf" {% if file_type == '.pdf' %}selected{% endif %}>PDF</option>
          <option value=".docx" {% if file_type == '.docx' %}selected{% endif %}>Word (docx)</option>
          <option value=".doc" {% if file_type == '.doc' %}selected{% endif %}>Word (doc)</option>
          <option value=".wps" {% if file_type == '.wps' %}selected{% endif %}>WPS</option>
          <option value=".txt" {% if file_type == '.txt' %}selected{% endif %}>TXT</option>
          <option value=".xlsx" {% if file_type == '.xlsx' %}selected{% endif %}>Excel (xlsx)</option>
          <option value=".xls" {% if file_type == '.xls' %}selected{% endif %}>Excel (xls)</option>
        </select>
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">文件名搜索</label>
        <input type="text" name="file_name" placeholder="输入文件名进行模糊搜索..." value="{{ file_name or '' }}">
      </div>
      <button type="submit">搜索</button>
    </form>
    <p style="margin-top: 20px; font-size: 14px; color: #666;">
      提示：关键词搜索适合单个或多个关键词，全文搜索适合完整句子或短语
    </p>
  </div>
</body>
</html>
