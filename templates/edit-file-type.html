<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑文件类型 - 文档检索系统</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-top: 50px;
      border-radius: 5px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .nav {
      text-align: center;
      margin-bottom: 30px;
    }
    .nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #0066cc;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    textarea {
      height: 100px;
      resize: vertical;
    }
    .action-buttons {
      margin-top: 30px;
    }
    .btn {
      padding: 10px 20px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #0052a3;
    }
    .btn-secondary {
      background-color: #6c757d;
      margin-right: 10px;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>文档检索系统</h1>
    <div class="nav">
      <a href="/">首页</a> | 
      <a href="/upload">上传文档</a> | 
      <a href="/search">搜索文档</a> | 
      <a href="/file-types">文件类型管理</a> | 
      <a href="/settings">系统设置</a>
    </div>
    <h2>编辑文件类型</h2>
    <form method="POST">
      <div class="form-group">
        <label for="name">类型名称</label>
        <input type="text" id="name" name="name" value="{{ file_type[1] }}" required>
      </div>
      <div class="form-group">
        <label for="description">描述</label>
        <textarea id="description" name="description">{{ file_type[2] }}</textarea>
      </div>
      <div class="action-buttons">
        <a href="/file-types" class="btn btn-secondary">取消</a>
        <button type="submit" class="btn">保存</button>
      </div>
    </form>
  </div>
</body>
</html>
