<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑分类 - 文档检索系统</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-top: 50px;
      border-radius: 5px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .nav {
      text-align: center;
      margin-bottom: 30px;
    }
    .nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #0066cc;
      font-weight: bold;
    }
    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-weight: bold;
      color: #555;
    }
    input[type="text"], textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      padding: 10px 20px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0052a3;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-size: 16px;
    }
    .btn-secondary {
      background-color: #666;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>文档检索系统</h1>
    <div class="nav">
      <a href="/">首页</a> | 
      <a href="/upload">上传文档</a> | 
      <a href="/search">搜索文档</a> | 
      <a href="/file-list">文件列表</a> | 
      <a href="/categories">分类管理</a> | 
      <a href="/settings">系统设置</a>
    </div>
    <h2>编辑分类</h2>
    <form class="edit-form" action="/categories/edit/{{ category[0] }}" method="post">
      <div class="form-group">
        <label for="name">分类名称</label>
        <input type="text" id="name" name="name" value="{{ category[1] }}" required>
      </div>
      <div class="form-group">
        <label for="description">分类描述</label>
        <textarea id="description" name="description">{{ category[2] }}</textarea>
      </div>
      <div class="action-buttons">
        <a href="/categories" class="btn btn-secondary">返回</a>
        <button type="submit">保存修改</button>
      </div>
    </form>
  </div>
</body>
</html>
